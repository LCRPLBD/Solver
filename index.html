<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neptune ECU Solver</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}
body{margin:0;background:#090d19;color:#eef2ff;padding:22px}
main{max-width:900px;margin:auto}h1{color:#b49aff}.muted{color:#aab5cc}
.panel,.register{background:#151b2c;border:1px solid #343b55;border-radius:14px;padding:20px;margin:16px 0}
.register{background:#101729}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.bits{display:flex;gap:5px;margin:12px 0;flex-wrap:nowrap}
.bit{flex:1;min-width:0;height:53px;font:700 20px monospace;padding:0}
.bit.on{background:#6d28d9;border-color:#c4b5fd}
button,input{background:#222b42;color:#fff;border:1px solid #46516b;border-radius:8px;padding:10px;font-size:15px}
button{cursor:pointer}button:hover{border-color:#a78bfa}.primary{background:#6d28d9;border-color:#8b5cf6}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}
label{display:inline-flex;align-items:center;gap:6px}input[type=number]{width:75px}
input[type=text]{width:160px}.hex{font-family:monospace;color:#c4b5fd}
pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
</style></head><body><main>
<h1>Neptune ECU Bit Solver</h1>
<p class="muted">Click each bit to toggle between 0 and 1. The leftmost bit is 128; the rightmost is 1. Set both current and target values, then solve.</p>
<div id="registers" class="grid"></div>
<section class="panel">
<h2>Allowed operations</h2>
<div class="controls"><label>XOR masks (hex) <input id="masks" type="text" value="59,8F"></label>
<label><input id="allowNot" type="checkbox" checked> NOT</label>
<label><input id="allowRol" type="checkbox"> ROL 1</label>
<label><input id="allowRor" type="checkbox"> ROR 1</label>
<label>Max steps <input id="maxSteps" type="number" min="1" max="15" value="8"></label></div>
<div class="controls"><button id="solve" class="primary">Solve ECU</button><button id="clear">Clear bits</button></div>
<pre id="result" aria-live="polite">Set the bits above to begin.</pre>
</section></main>
<script>
(() => {
const $=id=>document.getElementById(id);
const values={r0c:0,r0t:0,r1c:0,r1t:0};
const labels=[["r0c","R0 — Current"],["r0t","R0 — Target"],["r1c","R1 — Current"],["r1t","R1 — Target"]];
for(const [id,label] of labels){
 const box=document.createElement("section");box.className="register";
 const title=document.createElement("h2");title.textContent=label+" ";
 const hex=document.createElement("span");hex.className="hex";hex.id=id+"Hex";title.appendChild(hex);box.appendChild(title);
 const row=document.createElement("div");row.className="bits";row.setAttribute("role","group");row.setAttribute("aria-label",label);
 for(let bit=7;bit>=0;bit--){
  const btn=document.createElement("button");btn.className="bit";btn.type="button";
  btn.dataset.register=id;btn.dataset.bit=String(bit);btn.setAttribute("aria-label",label+" bit "+bit);
  btn.addEventListener("click",()=>{values[id]^=1<<bit;refresh();});row.appendChild(btn);
 }
 box.appendChild(row);$("registers").appendChild(box);
}
function refresh(){
 for(const [id] of labels){
  $(id+"Hex").textContent="0x"+values[id].toString(16).toUpperCase().padStart(2,"0");
  for(const btn of document.querySelectorAll('[data-register="'+id+'"]')){
   const on=Boolean(values[id]&(1<<Number(btn.dataset.bit)));
   btn.textContent=on?"1":"0";btn.classList.toggle("on",on);btn.setAttribute("aria-pressed",String(on));
  }
 }
 $("result").textContent="Ready to solve.";
}
$("clear").onclick=()=>{for(const id in values)values[id]=0;refresh();};
$("solve").onclick=()=>{
 const start=[values.r0c,values.r1c],target=[values.r0t,values.r1t];
 const input=$("masks").value.trim();
 const parts=input?input.split(/[\s,;]+/).filter(Boolean):[];
 if(parts.some(v=>!/^(?:0x)?[0-9a-f]{1,2}$/i.test(v))){
  $("result").textContent="Invalid XOR masks. Use hexadecimal bytes like 59,8F.";return;
 }
 const masks=[...new Set(parts.map(v=>parseInt(v.replace(/^0x/i,""),16)))];
 const ops=masks.map(m=>["XOR 0x"+m.toString(16).toUpperCase().padStart(2,"0"),v=>v^m]);
 if($("allowNot").checked)ops.push(["NOT",v=>v^255]);
 if($("allowRol").checked)ops.push(["ROL 1",v=>((v<<1)|(v>>7))&255]);
 if($("allowRor").checked)ops.push(["ROR 1",v=>((v>>1)|(v<<7))&255]);
 const max=Math.min(15,Math.max(1,Number($("maxSteps").value)||8));
 const key=v=>(v[0]<<8)|v[1];
 const queue=[{v:start,steps:[]}],seen=new Set([key(start)]);
 let answer=null;
 for(let i=0;i<queue.length;i++){
  const node=queue[i];
  if(key(node.v)===key(target)){answer=node.steps;break;}
  if(node.steps.length>=max)continue;
  for(let r=0;r<2;r++)for(const [name,fn] of ops){
   const next=node.v.slice();const before=next[r];next[r]=fn(before);
   const k=key(next);if(seen.has(k))continue;seen.add(k);
   const hx=v=>v.toString(16).toUpperCase().padStart(2,"0");
   queue.push({v:next,steps:[...node.steps,"R"+r+" → "+name+" (0x"+hx(before)+" → 0x"+hx(next[r])+")"]});
  }
 }
 $("result").textContent=answer===null?"No solution within "+max+" steps using the selected operations.":
 answer.length===0?"Already solved.":answer.map((step,i)=>(i+1)+". "+step).join("\n");
};
refresh();
})();
</script></body></html>
